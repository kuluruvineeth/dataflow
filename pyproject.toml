[project]
name = "dataflow"
version = "0.1.0"
description = "Streaming, sharded, resumable pipelines for preparing language-model training data"
license = "Apache-2.0"
authors = [
    { name = "Kuluru Vineeth", email = "kuluruvineeth8623@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer>=3.5.2",
    "cloudpickle>=3.1.2",
    "fasttext-numpy2-wheel>=0.9.2",
    "fsspec>=2026.9.0",
    "ftfy>=6.3.1",
    "httpx>=0.28",
    "huggingface-hub>=1.33.0",
    "numpy>=2.5.3",
    "orjson>=3.12.0",
    "pyarrow>=25.0.1",
    "regex>=2026.9.29",
    "spacy>=3.8",
    "tldextract>=5.3.2",
    "tokenizers>=0.23.2",
    "trafilatura>=2.2.0",
    "warcio>=1.8.1",
    "zstandard>=0.23",
]

[project.optional-dependencies]
monitor = [
    "trackio>=0.40.0",
]
classifiers = [
    "torch>=2.8",
    "transformers>=4.56",
]
ray = [
    "ray>=2.59.0",
]

[project.scripts]
dataflow = "dataflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "dataflow[classifiers,ray]",
    "hypothesis>=6.168.5",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
