[project]
name = "dataflow"
version = "0.1.0"
description = "Streaming, sharded, resumable pipelines for preparing language-model training data"
authors = [
    { name = "Kuluru Vineeth", email = "kuluruvineeth8623@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
